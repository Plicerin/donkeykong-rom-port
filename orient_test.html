<canvas id="c" width="400" height="400"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const scale = 10;

// Full DK data from the ASM (20 bytes, with leading $00)
const DK_ASM = [0x00,0xE0,0xE0,0x67,0x67,0x7E,0x7E,0x3E,0x5E,0xDC,0xBC,0xFE,0xFF,0x7F,0x39,0x45,0x7D,0x55,0x7C,0x38];
// My current DK (19 bytes, missing leading $00)
const DK_MY = [0xE0,0xE0,0x67,0x67,0x7E,0x7E,0x3E,0x5E,0xDC,0xBC,0xFE,0xFF,0x7F,0x39,0x45,0x7D,0x55,0x7C,0x38];

function drawLabeled(sp, x, y, flip, title) {
    ctx.fillStyle='#fff';
    ctx.fillText(title, x, y-5);
    ctx.strokeStyle='#666';
    ctx.strokeRect(x, y, 8*scale, sp.length*scale);
    for(let r=0;r<sp.length;r++){
        const drawRow = flip ? (sp.length-1-r) : r;
        const b = sp[drawRow];
        for(let c=0;c<8;c++){
            if(b&(0x80>>c)) ctx.fillRect(x+c*scale, y+r*scale, scale, scale);
        }
    }
    // Label first and last row
    ctx.fillStyle='#0f0';
    ctx.fillText('row0', x, y+scale-2);
    ctx.fillStyle='#f00';
    ctx.fillText('row'+(sp.length-1), x, y+(sp.length-1)*scale+scale-2);
}

// Draw all 4 combinations
// 1. ASM data, NO FLIP (row0 at top)
drawLabeled(DK_ASM, 10, 40, false, '1: ASM data, NO FLIP');
// 2. ASM data, FLIP (last row at top)
drawLabeled(DK_ASM, 110, 40, true, '2: ASM data, FLIP');
// 3. MY data, NO FLIP
drawLabeled(DK_MY, 210, 40, false, '3: MY data, NO FLIP');
// 4. MY data, FLIP
drawLabeled(DK_MY, 310, 40, true, '4: MY data, FLIP');

ctx.fillStyle='#ff0';
ctx.fillText('green=row0, red=last row', 10, 390);
ctx.fillText('ASM kernel reads BACKWARDS (last byte first)', 10, 370);
</script>
