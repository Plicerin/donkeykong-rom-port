<!DOCTYPE html>
<html>
<head><title>Analyze 1.png</title>
<style>
  body{margin:0;background:#222;display:flex}
  #container{position:relative}
  canvas{position:absolute;top:0;left:0;image-rendering:pixelated}
  #info{color:#fff;font:14px monospace;padding:10px;width:400px}
</style>
</head>
<body>
<div id="container">
  <img id="src" src="user_image.png" style="image-rendering:pixelated">
  <canvas id="overlay"></canvas>
</div>
<div id="info">Click the image to get pixel coordinates. 
  <br>Red: R>200, G<80, B<80
  <br>
  <div id="pos"></div>
  <div id="scan"></div>
</div>
<script>
const img=document.getElementById('src');
const c=document.getElementById('overlay');
const ctx=c.getContext('2d');
img.onload=()=>{
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  ctx.drawImage(img,0,0);
  // Scan for red pixels
  const d=ctx.getImageData(0,0,c.width,c.height);
  const redCols=[];
  for(let x=0;x<c.width;x++){
    let count=0;
    for(let y=0;y<c.height;y++){
      const i=(y*c.width+x)*4;
      const r=d.data[i],g=d.data[i+1],b=d.data[i+2];
      if(r>200&&g<80&&b<80)count++;
    }
    if(count>50)redCols.push({x,count});
  }
  document.getElementById('scan').innerHTML='Found '+redCols.length+' red columns:<br>'+
    redCols.map(r=>'x='+r.x+' ('+Math.round(r.x*320/c.width)+' game) - '+r.count+' red px').join('<br>');
  // Draw vertical lines at detected positions
  ctx.strokeStyle='lime';ctx.lineWidth=1;
  for(let r of redCols){
    ctx.beginPath();ctx.moveTo(r.x,0);ctx.lineTo(r.x,c.height);ctx.stroke();
  }
};
img.onclick=(e)=>{
  const rect=c.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const scaleX=c.width/rect.width,scaleY=c.height/rect.height;
  const ix=Math.round(sx*scaleX),iy=Math.round(sy*scaleY);
  const i=(iy*c.width+ix)*4;
  ctx.clearRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0);
  ctx.strokeStyle='yellow';
  ctx.beginPath();ctx.moveTo(ix,0);ctx.lineTo(ix,c.height);ctx.stroke();
  // draw red marks again for reference
  ctx.strokeStyle='lime';ctx.lineWidth=1;
  for(let r of redCols){
    ctx.beginPath();ctx.moveTo(r.x,0);ctx.lineTo(r.x,c.height);ctx.stroke();
  }
  const d2=ctx.getImageData(0,0,c.width,c.height);
  const ri=d2.data[i],gi=d2.data[i+1],bi=d2.data[i+2];
  document.getElementById('pos').innerHTML=
    'Image x='+ix+', y='+iy+' RGBA('+ri+','+gi+','+bi+')<br>'+
    'Game x='+Math.round(ix*320/c.width)+', y='+Math.round(iy*240/c.height);
};
</script>
</body>
</html>
