<!DOCTYPE html>
<html><body>
<canvas id="c"></canvas>
<pre id="out"></pre>
<script>
const img = new Image();
img.onload = function(){
  const c = document.getElementById('c');
  c.width = 320; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 320, img.height);
  let out = '';
  const purple = (r,g,b) => Math.abs(r-189)<20 && Math.abs(g-102)<20 && Math.abs(b-175)<20;
  for(let y=50; y<180; y++){
    let l=-1, r=-1, cnt=0;
    for(let x=0; x<320; x++){
      const d = ctx.getImageData(x,y,1,1).data;
      if(purple(d[0],d[1],d[2])){
        if(l===-1) l=x;
        r=x; cnt++;
      }
    }
    if(cnt>0) out += 'y' + y + ' L=' + l + ' R=' + r + ' cnt=' + cnt + (l>=0 ? ' offset=' + (r-l+1) : '') + '\n';
    else out += 'y' + y + ': ---\n';
  }
  document.getElementById('out').textContent = out;
};
img.src = 'ref.gif';
</script>
</body></html>
