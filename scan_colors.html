<!DOCTYPE html>
<html><body><canvas id="c" width="320" height="240"></canvas>
<pre id="out"></pre>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const img=new Image();
img.onload=function(){
    cx.drawImage(img,0,0,320,240);
    const d=cx.getImageData(0,0,320,240).data;
    // Check what colors appear at platform surface positions
    // W0 surface should be around y=53-64
    // Let's sample some key positions
    const samples=[{y:50,x:100},{y:64,x:100},{y:80,x:70},{y:100,x:70},{y:130,x:100},{y:150,x:80}];
    let out='Color samples:\n';
    for(let s of samples){
        const i=(s.y*320+s.x)*4;
        out+=`(${s.x},${s.y}): rgb(${d[i]},${d[i+1]},${d[i+2]})\n`;
    }
    // Also check the W0 surface area for ALL brown-like colors
    out+='\nAll distinct colors at y=64 (W0 surface):\n';
    let colors={};
    for(let x=50;x<200;x++){
        const i=(64*320+x)*4;
        const key=`${d[i]},${d[i+1]},${d[i+2]}`;
        colors[key]=(colors[key]||0)+1;
    }
    for(let c in colors){
        if(colors[c]>1)out+=`  rgb(${c}): ${colors[c]}px\n`;
    }
    document.getElementById('out').textContent=out;
};
img.src='ref.gif';
</script></body></html>
