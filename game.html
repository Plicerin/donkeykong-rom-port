// Downhill roll direction per girder from its slant (GEO[w]=[xL,xR,yL,yR]).
// yR>yL => lower on the right => rolls RIGHT (+1); yR<yL => rolls LEFT (-1);
// flat girders (W0,W1,GND) return 0 = keep current direction.
function downhillDir(w){
  const G=geo();
  if(w<0||w>=G.length)return 0;
  const g=G[w];const dy=g[3]-g[2];
  if(dy>0)return 1;    // lower to the right -> roll right
  if(dy<0)return -1;   // lower to the left  -> roll left
  return 0;            // flat
}

  let xx=x; if(xx<g[0])xx=g[0]; if(xx>g[1])xx=g[1];
  return Math.round(g[2]+(g[3]-g[2])*(xx-g[0])/(g[1]-g[0]));
}

const L2_TIA_BASE=[0x00,0x0C,0x28,0x44,0x60,0x7C];

function nextSeed(){st.seed=(st.seed+1)&0xFF; return st.seed;}

// --- TIA Y ↔ canvas / walkway (certified comparison space for fox + barrels) ---
function tiaYtoCanvas(ty){
  // Map ROM playfield $0C..$9A → canvas girder band ~70..228
  return Math.round(70+((ty-0x0C)*(228-70))/(0x9A-0x0C));
}
function canvasToTiaY(cy){
  return Math.round(0x0C+((cy-70)*(0x9A-0x0C))/(228-70))&0xFF;
}
function tiaBaseForWalkway(w){
  const t=isFire()?L2_TIA_BASE:L1_TIA_BASE;
  if(w>=0&&w<t.length) return t[w];
  return t[t.length-1];
}
function walkwayFromTiaY(ty){
  const t=isFire()?L2_TIA_BASE:L1_TIA_BASE;
  let best=0, bd=1e9;
  for(let i=0;i<t.length;i++){
    const d=Math.abs(t[i]-ty);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
// ASM: verPosMario. Grounded = platformBase+FAIR_PIXEL_DELTA; jump subtracts JUMPING_HEIGHT.
function marioTiaY(){
  if(st.cl!==0||st.flg){
    // climbing / falling: continuous canvas→TIA (exact equality rare — matches ROM mid-air miss)
    return canvasToTiaY(st.my);
  }
  const base=tiaBaseForWalkway(st.w);
  let y=(base+FAIR_PIXEL_DELTA)&0xFF;
  if(st.jht>0) y=(y-JUMPING_HEIGHT)&0xFF; // ASM sec sbc #JUMPING_HEIGHT at jump start
  return y;
}
function syncBarrelCanvas(o){
  o.x=(o.tiaX|0)*2;
  if(o.dir&0x80){
    // descending ladder — free TIA Y
    o.y=tiaYtoCanvas(o.tiaY);
    o.w=walkwayFromTiaY(o.tiaY);
  }else{
    o.w=walkwayFromTiaY(o.tiaY);
    // stick to girder surface for draw/collision (ramps already baked into tiaY steps)
    o.y=wy(o.w,o.x);
  }
}

function resetMarioToStart(){

  st.md=-1; st.jht=0; st.flg=0; st.cl=0; st.ham=0;
    HAMMER.taken=false;
  }

    // ROM StartNewScreen: clear obstacles, reset positions, init rivits if firefox
    st.obs=[]; st.ot=0; st.brc=0;
    st.rivits=[0,0,0,0];
    resetMarioToStart();

        // ASM StartNewFirefox: (seed&$1F)+$25 X, dir=bit0, Y=FirefoxVerPos,x, rivits,x.
        // ROM walkway index is inverted vs our GEO2 (ROM w0=bottom). We keep GEO2 w1..w4

        // pairing Mario CheckRivits uses for that girder). TIA Y from L2_TIA_BASE so
        // (foxY+FAIR_PIXEL_DELTA)==marioY when both grounded on that floor.
        for(let i=0;i<4;i++){
          const w=i+1;
          const tiaY=L2_TIA_BASE[w];
          const seed=nextSeed();
          const tiaX=0x25+(seed&0x1F);
          const x=tiaX*2;
          const d=(tiaX&1)?1:-1;
          st.obs.push({kind:'fox',x:x,y:wy(w,x),w:w,tiaX:tiaX,tiaY:tiaY,rivetIdx:i,d:d,a:true,s:1});
        }
      }
  }

function ia(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  ac=new(window.AudioContext||window.webkitAudioContext)();
  gain=ac.createGain(); gain.gain.value=0; gain.connect(ac.destination);
  osc=ac.createOscillator(); osc.type='square'; osc.frequency.value=440;
  osc.connect(gain); osc.start();
}
function tiaHz(audf,audc){
  // NTSC TIA approx (Stella-style): pure tones /6 for AUDC $0C, /2 for AUDC $04/$05
  const f=((audf|0)&0x1F)+1;
  if((audc&0x0F)===0x0C||(audc&0x0F)===0x04) return 31400/(f*6);
  if((audc&0x0F)===0x05) return 31400/(f*2);
  return 31400/(f*6);
}
function applyTiaAudio(){
  if(!ac||!osc)return;
  const v=(st.audv|0)&0x0F;
  const hz=tiaHz(st.audf|0, st.audc|0);
  try{
    osc.frequency.setTargetAtTime(Math.max(20,hz), ac.currentTime, 0.005);
    gain.gain.setTargetAtTime(v>0?(v/15)*0.12:0, ac.currentTime, 0.008);
  }catch(e){}
}
// ASM PlayMusic: A=soundDuration type, X=soundIndex start
function playMusic(duration,index){
  st.sndDur=duration&0xFF;
  st.sndIdx=index&0xFF;
  st.audc=0x0C;
  st.audv=0x0F;
  // prime first AUDF from table at current index (ROM decs first frame — we dec in updateSound)
  applyTiaAudio();
}
function playDeathSound(){
  // NTSC: ldx #$11 / lda #$04 / PlayMusic
  playMusic(4, 0x11);
}
function playScoreSound(){
  // PlayIncrementScoreMusic / PlayGameOverMusic: ldx #$20 / lda #$03
  playMusic(3, 0x20);
}
function playLevelCompleteSound(){
  // ldx #$0A / lda #$05 / jsr PlayMusic
  playMusic(5, 0x0A);
}
function playWalkSound(){
  // ASM: only if soundDuration==0; AUDC=$05 AUDV=$0B dur=2 idx=2
  if(st.sndDur)return;
  st.audc=0x05; st.audv=0x0B;
  st.sndDur=2; st.sndIdx=2;
  st.audf=WalkingSoundFrequency[0];
  applyTiaAudio();
}
function playJumpSound(){
  // firebutton: soundDuration=1, soundIndex=JUMP_HANGTIME
  st.sndDur=1; st.sndIdx=0x1F;
  st.audc=0x0C;
  st.audv=0x0F;
}
// Per-frame ROM audio driver (~966-997) + jump volume (~783-790)
function updateSound(){
  // JumpingMario volume envelope while hang + duration==1
  if(st.jht>0 && st.sndDur===1){
    st.audc=0x0C;
    st.audv=(st.jht>>1)&0x0F;
  }
  if(!st.sndDur){
    st.audv=0;
    applyTiaAudio();
    return;
  }
  // duration>=4: advance every 4 frames; duration 1-3: every frame
  if(st.sndDur>=4 && (st.fr&3)!==0){
    applyTiaAudio();
    return;
  }
  st.sndIdx--;
  if(st.sndIdx<0){
    st.sndDur=0; st.audv=0; applyTiaAudio(); return;
  }
  let table=AudioFrequencyTable[st.sndDur];
  if(st.sndDur===1) table=JumpFreqExt;
  if(!table){ st.audv=0; applyTiaAudio(); return; }
  const idx=st.sndIdx;
  st.audf=(idx<table.length)?(table[idx]&0x1F):(table[table.length-1]&0x1F);
  if(st.sndDur!==1||st.jht<=0){
    // keep PlayMusic volume unless jump envelope owns it
    if(st.sndDur>=3) st.audv=0x0F;
  }
  applyTiaAudio();
}
// Back-compat wrappers used across update()
function sW(){playWalkSound()}
function sJ(){playJumpSound()}
function sS(){/* bonus tick: ROM silent on timer tick */}
function sD(){playDeathSound()}
function sL(){playLevelCompleteSound()}
function sScore(){playScoreSound()}

function dR(x,y,w,h,c){cx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';cx.fillRect(x,y,w,h)}

function dS(sp,x,y,clr){
    for(let r=0;r<sp.length;r++){
        const b=sp[r];
        for(let c=0;c<8;c++){
            if(b&(0x80>>c))dR(x+c,y+r,1,1,clr);
        }
    }
}
// Per-row colors (ASM COLUPx stripe tables). colors[r] applies to sprite row r.
// Null/missing color skips (blank pad rows) or falls back to body red.
function dSRows(sp,x,y,colors){
    for(let r=0;r<sp.length;r++){
        const b=sp[r]; if(!b)continue;
        const clr=(colors&&colors[r])||R;
        for(let c=0;c<8;c++){
            if(b&(0x80>>c))dR(x+c,y+r,1,1,clr);
        }
    }
}
// NUSIZ double-width (Donkey Kong): each bit -> 2px wide
function dS2x(sp,x,y,clr){
    for(let r=0;r<sp.length;r++){
        const b=sp[r]; if(!b)continue;
        for(let c=0;c<8;c++){
            if(b&(0x80>>c))dR(x+c*2,y+r,2,1,clr);
        }
    }
}

// === Mario graphics (donkey_kong_2600.asm MarioGraphics ~2000) ===
// ROM stores feet→head. We reverse once to canvas top-first.
// Raw bitmap faces LEFT; REFP0/mirror = face RIGHT (asm move-right sets REFLECT).
function revRows(a){return a.slice().reverse()}
const MARIO_S=revRows([// StationaryMarioSprite
  0x00,0x3F,0x1B,0x1B,0x3F,0x7B,0x75,0x76,0x7B,0x3F,0x1F,0x3E,0x0F,0xDB,0x6B,0x1A,0x7E,0x1C
]);
const MARIO_R1=revRows([// RunningMarioSprite1
  0x00,0x06,0x02,0x02,0xEE,0xFC,0xBD,0xBD,0x7F,0xF7,0xFE,0x9E,0x0F,0xDB,0x6B,0x1A,0x7E,0x1C,0x00
]);
const MARIO_R2=revRows([// RunningMarioSprite2
  0x00,0x1C,0x0C,0x0D,0x1F,0x1F,0x0E,0x7E,0x7E,0x3E,0x1C,0x0F,0xDB,0x6B,0x1A,0x7E,0x1C,0x00,0x00,0x00,0x00
]);
const MARIO_J=revRows([// JumpingMarioSprite
  0x00,0x00,0x07,0xFF,0xFE,0xBC,0x3F,0xFF,0xFE,0x3E,0x0F,0xDB,0x6B,0x1A,0x7E,0x1C
]);
const MARIO_C=revRows([// ClimbingMarioSprite
  0x00,0x1C,0x1C,0x0E,0x7E,0x7E,0xFE,0xFE,0x7F,0x7F,0x7F,0xFF,0xFE,0xFC,0x7C,0x60,0x00
]);

const BAR=[0x3C,0x6E,0xFB,0xBF,0xFD,0xDF,0x76,0x3C]; // ASM HorizontalBarrelSprite
const BAR_FALL=[0x7E,0x99,0xBD,0x81,0xBD,0x99,0x7E,0x00]; // ASM FallingBarrelSprite

function mirrorBytes(sp){
    const out=[];
    for(let r=0;r<sp.length;r++){
        let b=0;
        for(let i=0;i<8;i++)b|=((sp[r]>>i)&1)<<(7-i);
        out.push(b);
    }
    return out;
}
// _R = REFP0 reflected (face right). Unmirrored = face left.
const MARIO_S_R=mirrorBytes(MARIO_S);
const MARIO_R1_R=mirrorBytes(MARIO_R1);
const MARIO_R2_R=mirrorBytes(MARIO_R2);
const MARIO_J_R=mirrorBytes(MARIO_J);
const MARIO_C_R=mirrorBytes(MARIO_C);
const BAR_M=mirrorBytes(BAR); // REFP1 frame-flip stand-in for roll anim
const FOX_M=mirrorBytes(FOX);

// ASM HorizontalColors / VerticalColors after BLACK pad — feet→head order
// H: boots BG×2, body RED×8, face WHITE×5, hat RED×2
const MARIO_H_FEET=[BG_M,BG_M, R,R,R,R,R,R,R,R, W,W,W,W,W, R,R];
// V climb: boots BG×3, body/hat RED×11
const MARIO_V_FEET=[BG_M,BG_M,BG_M, R,R,R,R,R,R,R,R,R,R,R];
// Last solid row = feet contact (ignore blank pad under boots)
function marioFeetRow(sp){
    for(let r=sp.length-1;r>=0;r--) if(sp[r]) return r;
    return sp.length-1;
}
// Pin feet-first palette to the solid feet row (not array end — run/jump have pad)
function marioRowColors(sp,climb){
    const feet=climb?MARIO_V_FEET:MARIO_H_FEET;
    const out=new Array(sp.length).fill(null);
    const footRow=marioFeetRow(sp);
    // feet[0] → footRow, feet[1] → footRow-1, ... toward head
    for(let k=0;k<feet.length;k++){
        const r=footRow-k;
        if(r>=0&&r<sp.length) out[r]=feet[k];
    }
    return out;
}

// Girlfriend sprite (20 bytes, top-first). Visible rows 3..18 map to GirlfriendColors.
const GF=[0x00,0x00,0x00,0x07,0x1F,0x3A,0xBF,0x7E,0x9C,0x38,0x7E,0x18,0x3C,0x7E,0xFF,0x7F,0x7E,0x82,0x43,0x00];
// GirlfriendColors reversed to top-first: BLONDE×6, TQ×2, SASH_RED, TQ×5, YELLOW×2
const GF_CLR=[B,B,B,YL,YL,YL,YL,YL,YL,TQ,TQ,R,TQ,TQ,TQ,TQ,TQ,YL,YL,B];

// DonkeyKong bitmap (top-first). ROM draws with NUSIZ double-size + BROWN.
const DK=[0x38,0x7C,0x55,0x7D,0x45,0x39,0x7F,0xFF,0xFE,0xBC,0xDC,0x5E,0x3E,0x7E,0x7E,0x67,0x67,0xE0,0xE0,0x00];

function drawPlats(){
    if(!isFire()){
        for(let y in PLAT_DATA){
            const spans=PLAT_DATA[y];
            const yy=parseInt(y);
            for(let sp of spans){
                dR(sp[0],yy,sp[1]-sp[0]+1,1,BR);
            }
        }
        return;
    }
    // L2 flat girders (blue), rivet holes, ladder rungs
    const col=[40,90,200];
    const G=geo();
    for(let w=0;w<G.length;w++){
        const g=G[w];
        const y=g[2];
        const holes=[];
        const ri=RIVET_WS.indexOf(w);
        if(ri>=0){
            const rv=st.rivits[ri]|0;
            // additive: 6=left, 12=right, 18=both
            if(rv===RIVET_LEFT||rv>=RIVET_DONE) holes.push(RIVET_X[0]);
            if(rv===RIVET_RIGHT||rv>=RIVET_DONE) holes.push(RIVET_X[1]);
        }
        for(let t=0;t<3;t++){
            let segs=[[g[0],g[1]]];
            for(const hx of holes){
                const next=[];
                for(const [a,b] of segs){
                    const lo=hx-RIVET_HOLE, hi=hx+RIVET_HOLE;
                    if(hi<a||lo>b){next.push([a,b]);continue;}
                    if(a<lo) next.push([a,lo-1]);
                    if(hi<b) next.push([hi+1,b]);
                }
                segs=next;
            }
            for(const [a,b] of segs) if(b>=a) dR(a,y+t,b-a+1,1,col);
        }
        for(let x=g[0];x<=g[1];x+=8){
            if(holes.some(hx=>x>hx-(RIVET_HOLE+1)&&x<hx+(RIVET_HOLE+1))) continue;
            dR(x,y+3,4,1,col);
        }
    }
    for(const l of ladders()){
        const y0=wy(l.from,l.x)+4, y1=wy(l.to,l.x);
        for(let y=y0;y<y1;y+=4){
            dR(l.x-3,y,7,1,TQ);
            dR(l.x-4,y,1,3,TQ); dR(l.x+3,y,1,3,TQ);
        }
    }
}
function drawRivets(){
    if(!isFire())return;
    for(let i=0;i<RIVET_WS.length;i++){
        const w=RIVET_WS[i], rv=st.rivits[i]|0;
        for(let k=0;k<2;k++){
            const pulled=k===0?(rv===RIVET_LEFT||rv>=RIVET_DONE):(rv===RIVET_RIGHT||rv>=RIVET_DONE);
            if(pulled)continue;
            const x=RIVET_X[k], y=wy(w,x);
            dR(x-3,y-1,7,3,O);
            dR(x-2,y-2,5,1,YL);
        }
    }
}
function drawFox(o){
    if(!o||!o.a)return;
    const faceLeft=o.d<0;
    const sp=(Math.floor(st.fr/3)%2)?(faceLeft?FOX:FOX_M):(faceLeft?FOX_M:FOX);
    dS(sp, o.x-4, o.y-8, O);
}

function drawLadders(){
    // Ladders are NOT drawn here. The climbable rungs are the horizontal lines
    // already rendered by drawPlats(). The LADDERS array only DESIGNATES which
    // x-columns are climbable and which walkways they connect — it draws nothing.
}
function drawDK(){
    // ROM: NUSIZ0=DOUBLE_SIZE (16px wide), COLUP0=BROWN. Bottom sits on W0.
    dS2x(DK,64,wy(0)-19,BN);
}
function drawGF(){
    // Pauline to the right of double-width DK; ASM GirlfriendColors per scanline
    dSRows(GF,120,wy(0)-19,GF_CLR);
}
function drawBarrel(o){
    const top=o.y-8;
    // dS() draws from the sprite's LEFT edge; o.x is the barrel's CENTER (and the
    // ladder-column x it descends on). Offset by -4 (half the 8px sprite) so the
    // barrel renders centered on the ladder instead of 4px to the right.
    const dx=o.x-4;
    if(o.s===2){dS(BAR_FALL,dx,top,O);return}
    // ROM rolls one bitmap; REFP1←frameCount flips P1 — approximate with mirror
    dS((Math.floor(st.fr/2)%2)?BAR:BAR_M,dx,top,O);
}

const NFO=[
[0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
[0x7E,0x18,0x18,0x18,0x38,0x18,0x08,0x00],
[0x7E,0x18,0x18,0x7E,0x18,0x18,0x7E,0x00],
[0x7E,0x18,0x18,0x7E,0x18,0x18,0x7E,0x00],
[0x3C,0x24,0x24,0x7E,0x06,0x06,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x18,0x18,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x60,0x60,0x7E,0x00],
[0x7E,0x18,0x30,0x30,0x30,0x30,0x30,0x00],
[0x7E,0x60,0x60,0x7E,0x60,0x60,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x18,0x18,0x7E,0x00]];

function drawMario(){
    // Facing: raw bitmap = LEFT (NO_REFLECT); mirror = RIGHT (REFLECT).
    // Idle defaults to RIGHT like ROM init (InitializationTable1 REFLECT).
    let faceRight;
    if(st.jht>0) faceRight=(st.jht_dir===0xFE);
    else if(st.md===0) faceRight=false;
    else if(st.md===1) faceRight=true;
    else faceRight=true;

    let sp, climb=false;
    if(st.cl!==0){
        // Climb: alternate REFP0 each few frames (leg swap)
        sp=(Math.floor(st.fr/4)%2)?MARIO_C:MARIO_C_R;
        climb=true;
    }else if(st.jht>0||st.flg){
        sp=faceRight?MARIO_J_R:MARIO_J;
    }else if(keys['ArrowLeft']||keys['ArrowRight']||(st.md===0||st.md===1)){
        // Run cycle — even when keys released mid-stride keep last facing run frame if moving flag
        const run=(keys['ArrowLeft']||keys['ArrowRight']);
        if(run){
            const fr=Math.floor(st.fr/4)%2;
            sp=fr?(faceRight?MARIO_R1_R:MARIO_R1):(faceRight?MARIO_R2_R:MARIO_R2);
        }else{
            sp=faceRight?MARIO_S_R:MARIO_S;
        }
    }else{
        sp=faceRight?MARIO_S_R:MARIO_S;
    }
    // Feet on platform: feet row at st.my (surface). Sprite top = my - feetRow.
    const feet=marioFeetRow(sp);
    const top=st.my-feet;
    // st.mx = center; 8px player → left edge mx-4 (no artificial ±1 lean)
    const left=st.mx-4;
    const cols=marioRowColors(sp,climb);
    dSRows(sp,left,top,cols);
}


function drawScore(){
    const d=[];let s=st.score;
    for(let i=0;i<6;i++){d[i]=s%10;s=Math.floor(s/10)}
    for(let i=0;i<6;i++){
        const f=NFO[d[5-i]];
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
            if(f[r]&(0x80>>c))dR(260+i*8+c,2+r,1,1,W);
        }
    }
}

function drawBJCount(){
    const d=[];let n=st.bjc;
    for(let i=0;i<3;i++){d[i]=n%10;n=Math.floor(n/10)}
    for(let i=0;i<3;i++){
        const f=NFO[d[2-i]];
        if(!f)continue;
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
            if(f[r]&(0x80>>c))dR(260+i*8+c,12+r,1,1,YL);
        }
    }
}

function drawLives(){
    // Mini stationary Mario heads (hat+face rows only), colored
    for(let i=0;i<st.lives;i++){
        const cols=marioRowColors(MARIO_S,false);
        // draw rows 0..7 of standing Mario, 1:1 at bottom HUD
        for(let r=0;r<8;r++){
            const b=MARIO_S[r]; if(!b)continue;
            const clr=cols[r]||R;
            for(let c=0;c<8;c++) if(b&(0x80>>c)) dR(6+i*10+c,228+r,1,1,clr);
        }
    }
}

function render(){
    if(compMode&&refImg){
      // Comparison mode: show reference image, then overlay game diff
      // Step 1: draw reference as background
      for(let y=0;y<240;y++)for(let x=0;x<320;x++){
        const i=(y*320+x)*4;
        const rr=refImg[i],rg=refImg[i+1],rb=refImg[i+2],ra=refImg[i+3];
        if(ra<128){cx.fillStyle='#222';cx.fillRect(x,y,1,1);continue}
        cx.fillStyle='rgb('+rr+','+rg+','+rb+')';
        cx.fillRect(x,y,1,1);
      }
      // Step 2: generate expected game pixels from same logic as drawPlats/drawDK/drawGF
      const gpx={};
      function gPx(x,y){gpx[y+':'+x]=true}
      // Platform pixels from reference PLAT_DATA (walkways + sweeps + connectors)
      for(let y in PLAT_DATA){
        const spans=PLAT_DATA[y];const yy=parseInt(y);
        for(let sp of spans)for(let x=sp[0];x<=sp[1];x++)gPx(x,yy);
      }
      // DK sprite pixels (at position 68, wy(0)-19)
      const DKy=wy(0)-19;
      const DK=[0x38,0x7C,0x55,0x7D,0x45,0x39,0x7F,0xFF,0xFE,0xBC,0xDC,0x5E,0x3E,0x7E,0x7E,0x67,0x67,0xE0,0xE0,0x00];
      for(let r=0;r<DK.length;r++){const b=DK[r];if(b===0)continue;for(let c=0;c<8;c++)if(b&(0x80>>c))gPx(68+c,DKy+r)}
      // GF sprite pixels (at position 115, wy(0)-19)
      const GFy=wy(0)-19;
      for(let r=0;r<GF.length;r++){const b=GF[r];if(b===0)continue;for(let c=0;c<8;c++)if(b&(0x80>>c))gPx(115+c,GFy+r)}
      // Step 3: compare game pixels vs reference
      for(let k in gpx){
        const [yy,xx]=k.split(':').map(Number);
        if(xx<0||xx>=320||yy<0||yy>=240)continue;
        const i=(yy*320+xx)*4;
        const rr=refImg[i],rg=refImg[i+1],rb=refImg[i+2],ra=refImg[i+3];
        if(ra<128){cx.fillStyle='rgba(255,0,0,0.5)';cx.fillRect(xx,yy,1,1);continue}
        const th=40; // tolerance
        if(Math.abs(rr-BR[0])<th&&Math.abs(rg-BR[1])<th&&Math.abs(rb-BR[2])<th){
          cx.fillStyle='rgba(0,255,0,0.3)';cx.fillRect(xx,yy,1,1);
        }else{
          cx.fillStyle='rgba(255,0,0,0.5)';cx.fillRect(xx,yy,1,1);
        }
      }
      cx.fillStyle='#0f0';cx.font='10px monospace';
      cx.fillText('C: toggle   Green=pixel match   Red=extra game pixel   Ref bg=no overlay',5,15);
      return;
    }
    if(st.mode===0){drawAttract();return}
    if(st.mode===1){drawGO();return}
    if(st.mode===2){drawWin();return}
    if(st.mode!==128)return;
    cx.fillStyle='rgb('+B[0]+','+B[1]+','+B[2]+')';
    cx.fillRect(0,0,320,240);
    drawPlats();
    drawLadders();
    drawRivets();
    drawDK();
    drawGF();
    for(let o of st.obs){
        if(o.kind==='fox') drawFox(o);
        else drawBarrel(o);
    }
    drawMario();
    drawScore();
    drawBJCount();
    drawLives();
    drawBonus();
    drawHammer();
}

// ASM Mallot/Handle anim1/2 enable topology (frameCount&$08).
// Pose1 (up): head high + mid handle. Pose2 (swing): long head + split handle.
// Canvas draws solid blocks from those spans (ROM ENAM is 1-bit on/off).
function drawHammer(){
    const HD=[230,230,240], HN=[180,120,50];
    const anim2=st.ham>0 && (st.fr&0x08)!==0;
    let cx0, top, face=1;
    if(st.ham>0){
        face=(st.md===0||(st.jht>0&&st.jht_dir===0xFD))?-1:1;
        // asm offsets in canvas px (TIA×2): mallet ±, handle beside
        cx0=st.mx+(face<0?-4:18);
        top=st.my-14;
    }else if(!HAMMER.taken){
        const hd=hammerDef();
        cx0=hd.x; top=wy(hd.w,hd.x)-14; face=1;
    }else return;
    if(!anim2){

function bcdToDec(b){return ((b>>4)&0xF)*10+(b&0xF);}
function bcdDec1(b){
    // SED/SEC/SBC #$01 on bonusTimer
    let lo=(b&0x0F)-1, hi=(b>>4)&0x0F;
    if(lo<0){lo=9;hi--;}
    if(hi<0)return 0;
    return ((hi&0xF)<<4)|(lo&0xF);
}

function onPlatform(mx,my){
    for(let w=0;w<nW();w++){
        const surf=zig()[w];
        const gy=wy(w,mx);
        if(mx>=surf[0]&&mx<=surf[1]&&my>=gy&&my<gy+4)return w;
    }
    return -1;
}

    // pulsing heart
    if(Math.floor(st.fr/8)%2){
        cx.fillStyle='rgb('+R[0]+','+R[1]+','+R[2]+')';
        cx.font='20px monospace';
        cx.fillText('\u2665',160,140);
    }
    cx.textAlign='left';
}

function loop(){
    // PAL 50fps: run game logic at 20ms intervals
    // Use rAF for smooth rendering only
    const now=performance.now();
    if(now-lt>=20){lt=now;if(!paused){update();render()}}
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Debug/playtest API (Playwright bot) — not used by players
window.__DK={
  getState(){
    return {
      mode:st.mode,screen:st.screen,level:st.level,w:st.w,mx:st.mx,my:st.my,md:st.md,
        jht:st.jht,ham:st.ham,bonus:st.bonus,bonusDec:bcdToDec(st.bonus),
        score:st.score,lives:st.lives,fr:st.fr,seed:st.seed,rivits:st.rivits.slice(),cl:st.cl,
          sndDur:st.sndDur,sndIdx:st.sndIdx,audf:st.audf,audv:st.audv,audc:st.audc,
      obs:st.obs.filter(o=>o.a).map(o=>({
                kind:o.kind||'barrel',x:o.x,y:o.y,w:o.w,d:o.d,
                tiaX:o.tiaX,tiaY:o.tiaY,dir:o.dir,ladderIdx:o.ladderIdx
              })),
              hammer:{taken:HAMMER.taken,w:hammerDef().w,x:hammerDef().x,ham:st.ham},
              ladders:ladders().length,
              marioTiaY:marioTiaY()
            };
          },
    pause(p){paused=!!p;},
    start(){sp=true;},
    keys(k){
      keys['ArrowLeft']=!!k.left; keys['ArrowRight']=!!k.right;
      keys['ArrowUp']=!!k.up; keys['ArrowDown']=!!k.down;
      keys['Space']=!!k.jump; keys['KeyZ']=!!k.jump;
    },
    clearKeys(){for(const k of Object.keys(keys))keys[k]=false;},
    setSeed(v){st.seed=(v|0)&0xFF;},
    forceL2(){
      paused=true;
      st.mode=128; st.screen=1; st.level=2; st.bonus=STARTING_BONUS;
      st.lives=5; st.score=0; st.dcd=0; st.flg=0; st.jht=0; st.cl=0; st.fr=1; st.seed=0x40;
      HAMMER.taken=false; st.ham=0; startScreen(); render();
    },
    forceL1(){
      paused=true;
      st.mode=128; st.screen=0; st.level=1; st.bonus=STARTING_BONUS;
      st.lives=5; st.score=0; st.dcd=0; st.flg=0; st.jht=0; st.cl=0; st.fr=1; st.seed=0x40;
      HAMMER.taken=false; st.ham=0; startScreen(); render();
    },
    place(w,x){st.w=w;st.mx=x|0;st.my=wy(w,x|0);st.jht=0;st.flg=0;st.cl=0;st.dcd=0;st.mr=0;},
    tick(n){const N=n||1;for(let i=0;i<N;i++)update();render();},
    grantHammer(){
      HAMMER.taken=true; st.ham=MAX_HAMMER_TIME; st.jht=0; st.flg=0; st.md=1; render();
    },
    hammerPixelCount(){
      render();
      const img=cx.getImageData(0,0,320,240).data;
      let n=0;
      const x0=Math.max(0,st.mx-8), x1=Math.min(320,st.mx+40);
      const y0=Math.max(0,st.my-20), y1=Math.min(240,st.my+2);
      for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
        const i=(y*320+x)*4;
        // count bright grey/brown hammer-ish pixels
        if(img[i]>140&&img[i+1]>80&&img[i+2]>30) n++;
      }
      return n;
    },
    setRivit(i,v){st.rivits[i]=v;},
    pullAllRivets(){st.rivits=[0x12,0x12,0x12,0x12];},
        clearObstacles(){st.obs=[];},
        // Spawn one barrel at canvas x on walkway w (smash tests)
        spawnBarrel(w,x){
          const xx=x|0; const ww=w|0;
          const o={
            kind:'barrel',x:xx,w:ww,d:1,s:1,a:true,
            tiaX:xx>>1,tiaY:tiaBaseForWalkway(ww),
            dir:OBSTACLE_MOVING_RIGHT
          };
          o.y=wy(ww,xx);
          st.obs.push(o);
        },
        // Spawn barrel at exact ASM TIA coords (ladder/ramp certification)
        spawnBarrelTia(tiaX,tiaY,dir){
          const o={
            kind:'barrel',a:true,s:1,
            tiaX:tiaX&0xFF,tiaY:tiaY&0xFF,
            dir:(dir==null?OBSTACLE_MOVING_RIGHT:dir)&0xFF,
            d:((dir==null?1:dir)&1)?1:-1
          };
          syncBarrelCanvas(o);
          st.obs.push(o);
          return {x:o.x,y:o.y,w:o.w,tiaX:o.tiaX,tiaY:o.tiaY,dir:o.dir};
        },
        setFoxTiaY(idx,ty){
          const foxes=st.obs.filter(o=>o.a&&o.kind==='fox');
          if(foxes[idx]){
            foxes[idx].tiaY=ty&0xFF;
            foxes[idx].w=walkwayFromTiaY(ty&0xFF);
            foxes[idx].y=wy(foxes[idx].w,foxes[idx].x);
          }
        }
      };
</script>
