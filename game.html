<body>
<canvas id="c" width="320" height="240" autofocus></canvas>
<script>
const cv=document.getElementById('c');const cx=cv.getContext('2d');

// PAL TIA colors (reference: donkey_kong_pal_6.gif)
const BR=[189,102,175]; // platform purple
const TQ=[0,200,200];   // cyan/ladder
const O=[180,60,0];     // orange/DK
const R=[200,40,40];    // red/Mario
const YL=[180,160,30];  // yellow/Pauline hair
const W=[255,255,255];  // white
const BL=[0,70,170];    // blue
const B=[0,0,0];        // black
const BG=[30,130,130];  // background teal
const LG=[160,230,60];  // lime

// Walkway y-positions (from reference GIF at native 320x240)
const WY=[70,95,131,155,183,228];
const NW=6;
function wy(w){return WY[w]}

// Walkway surface x-ranges (from reference color scan)
// W0: full surface [64-159], between edge posts [72-151]
// W1: posts at [96-103,136-143], gap between = [104-135] 
// W2: posts at [128-135,176-183], gap = [136-175]
// W3: posts at [96-103,160-167], gap = [104-159]
// Ground: full surface [64-255]
const ZIG=[[64,159],[64,239],[96,143],[128,183],[96,167],[64,255]];

// Diagonal sweep connector data (connecting walkways)
// Generated from reference — these create the diagonal girder transitions
const PLAT_DATA = {
  // Score area
  58: [[232,239],[248,255]],
  59: [[232,239],[248,255]],
  60: [[232,239],[248,255]],
  61: [[232,239],[248,255]],
  62: [[232,239],[248,255]],
  63: [[232,239],[248,255]],
  64: [[232,239],[248,255]],
  65: [[232,239],[248,255]],
  // W0 SURFACE
  70: [[64,159]],
  71: [[64,159]],
  // W0 edge posts (every 4 rows)
  75: [[64,71],[152,159]],
  79: [[64,71],[152,159]],
  83: [[64,71],[152,159]],
  87: [[64,71],[152,159]],
  91: [[64,71],[152,159]],
  // Support band
  95: [[64,239]],
  96: [[64,71],[80,95],[104,119],[128,143],[152,167],[176,191],[200,215],[224,239]],
  97: [[72,79],[96,103],[120,127],[144,151],[168,175],[192,199],[216,223]],
  98: [[64,71],[80,95],[104,119],[128,143],[152,167],[176,191],[200,215],[224,239]],
  99: [[64,239]],
  // Diagonal transition (post-to-post)
  103: [[152,159],[216,223]],
  104: [[116,123]],
  105: [[116,123]],
  106: [[116,123]],
  107: [[216,223]],
  111: [[216,223]],
  115: [[152,159],[216,223]],
  // Right sweep (descending)
  116: [[232,255]],
  117: [[208,239],[248,255]],
  118: [[184,215],[224,231],[240,247]],
  119: [[152,191],[200,207],[216,223],[232,239],[248,255]],
  120: [[136,167],[176,183],[192,199],[208,215],[224,255]],
  121: [[112,143],[152,159],[168,175],[184,191],[200,231]],
  122: [[88,119],[128,135],[144,151],[160,167],[176,207]],
  123: [[80,95],[104,111],[120,127],[136,143],[152,183],[200,207]],
  124: [[80,87],[96,103],[112,119],[128,159]],
  125: [[88,95],[104,135]],
  126: [[80,111]],
  127: [[80,87],[96,103],[136,143],[200,207]],
  // W1 posts (walkway level 1)
  131: [[96,103],[136,143]],
  135: [[96,103],[136,143]],
  139: [[96,103],[136,143],[200,207]],
  143: [[96,103],[136,143],[200,207]],
  // Left sweep (descending)
  144: [[64,87]],
  145: [[64,71],[80,111]],
  146: [[72,79],[88,95],[104,135]],
  147: [[64,71],[80,87],[96,103],[112,119],[128,159],[200,207]],
  148: [[64,95],[104,111],[120,127],[136,143],[152,183]],
  149: [[88,119],[128,135],[144,151],[160,167],[176,207]],
  150: [[112,143],[152,159],[168,175],[184,191],[200,231]],
  151: [[128,167],[176,183],[192,199],[208,215],[224,239]],
  152: [[160,191],[200,207],[216,223],[232,239]],
  153: [[184,215],[224,231]],
  154: [[208,239]],
  155: [[128,135],[176,183],[216,223],[232,239]],
  // W2 posts (walkway level 2)
  159: [[176,183],[216,223]],
  163: [[176,183],[216,223]],
  167: [[128,135],[176,183],[218,219]],
  171: [[128,135],[176,183],[220,221]],
  // Right sweep (descending)
  172: [[232,255]],
  173: [[208,239],[248,255]],
  174: [[184,215],[224,231],[240,247]],
  175: [[128,135],[160,191],[200,207],[216,223],[232,239],[248,255]],
  176: [[136,167],[176,183],[192,199],[208,215],[224,255]],
  177: [[112,143],[152,159],[168,175],[184,191],[200,231]],
  178: [[88,119],[128,135],[144,151],[160,167],[176,207]],
  179: [[80,95],[104,111],[120,127],[136,143],[152,183],[200,207]],
  180: [[80,87],[96,103],[112,119],[128,159]],
  181: [[88,95],[104,135]],
  182: [[80,111]],
  183: [[80,87],[96,103],[160,167]],
  // W3 posts (walkway level 3)
  187: [[96,103],[160,167]],
  191: [[96,103],[160,167]],
  195: [[96,103],[160,167]],
  199: [[96,103],[160,165]],
  // Left sweep (descending)
  200: [[64,87]],
  201: [[64,71],[80,111]],
  202: [[72,79],[88,95],[104,135]],
  203: [[64,71],[80,87],[96,103],[112,119],[128,167]],
  204: [[64,95],[104,111],[120,127],[136,143],[152,183]],
  205: [[88,119],[128,135],[144,151],[160,167],[176,207]],
  206: [[112,143],[152,159],[168,175],[184,191],[200,231]],
  207: [[136,167],[176,183],[192,199],[208,215],[224,239]],
  208: [[160,191],[200,207],[216,223],[232,239]],
  209: [[184,215],[224,231]],
  210: [[208,239]],
  211: [[144,151],[216,223],[232,239]],
  // Lower posts
  215: [[216,223]],
  216: [[72,87]],
  218: [[72,87]],
  219: [[216,223]],
  220: [[72,87]],
  222: [[72,87]],
  223: [[144,151],[216,223]],
  224: [[72,87]],
  226: [[72,87]],
  227: [[144,151],[216,223]],
  // GROUND
  228: [[64,255]],
  229: [[64,255]],
};

let st={mode:0,w:5,mx:160,my:228,md:-1,mr:0,lives:2,score:0,bt:80,obs:[],brs:80,
        jht:0,jht_dir:0xFF,hmt:0,fr:0,ot:0,dcd:0,got:0,flg:0,brc:0,
        cl:0,ct:0,cx:0,bjc:0};
let keys={},sp=false,lt=0,paused=false,compMode=false;
let refImg=null;
function loadRef(){
  refImg=new Image();
  refImg.onload=()=>{
    const tmp=document.createElement('canvas');
    tmp.width=320;tmp.height=240;
    const t=tmp.getContext('2d');
    t.drawImage(refImg,0,0);
    refImg=t.getImageData(0,0,320,240).data;
  };
  refImg.src='ref.gif?'+Date.now();
}

let ac=null;
function ia(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)()}
function pt(f,d,t,v){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
o.type=t||'square';o.frequency.value=f;g.gain.value=v||.08;
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function sW(){pt(800,.05,'square',.04)}
function sJ(){pt(600,.1,'square',.08)}
function sS(){pt(1200,.08,'square',.06)}
function sD(){pt(200,.3,'sawtooth',.1);setTimeout(()=>pt(150,.4,'sawtooth',.08),300)}
function sL(){pt(800,.1,'square',.08);setTimeout(()=>pt(1000,.1,'square',.08),100)}

window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){sp=true;cv.focus()
}if(e.code==='KeyC'){if(!refImg)loadRef();compMode=!compMode}if(e.code==='KeyP'){paused=!paused}if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='Space')e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.code]=false;e.preventDefault()});
window.addEventListener('click',()=>cv.focus());

function dR(x,y,w,h,c){cx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';cx.fillRect(x,y,w,h)}

function dS(sp,x,y,clr){
    for(let r=0;r<sp.length;r++){
        const b=sp[r];
        for(let c=0;c<8;c++){
            if(b&(0x80>>c))dR(x+c,y+r,1,1,clr);
        }
    }
}

// ASM 2600 sprites (reversed from feet-first ASM to canvas top-first)
// StationaryMarioSprite (18 bytes, 18 rows)
const MARIO_S=[0x1C,0x7E,0x1A,0x6B,0xDB,0x0F,0x3E,0x1F,0x3F,0x7B,0x76,0x75,0x7B,0x3F,0x1B,0x1B,0x3F,0x00];
// RunningMarioSprite1 (19 bytes)
const MARIO_R1=[0x00,0x1C,0x7E,0x1A,0x6B,0xDB,0x0F,0x9E,0xFE,0xF7,0x7F,0xBD,0xBD,0xFC,0xEE,0x02,0x02,0x06,0x00];
// RunningMarioSprite2 (21 bytes)
const MARIO_R2=[0x00,0x00,0x00,0x00,0x1C,0x7E,0x1A,0x6B,0xDB,0x0F,0x1C,0x3E,0x7E,0x7E,0x0E,0x1F,0x1F,0x0D,0x0C,0x1C,0x00];
// JumpingMarioSprite (16 bytes)
const MARIO_J=[0x1C,0x7E,0x1A,0x6B,0xDB,0x0F,0x3E,0xFE,0xFF,0x3F,0xBC,0xFE,0xFF,0x07,0x00,0x00];

const BAR=[0x3C,0x6E,0xFB,0xBF,0xFD,0xDF,0x76,0x3C]; // ASM HorizontalBarrelSprite
const BAR2=[0x3C,0x7E,0xDD,0xDF,0xF7,0xB7,0x7E,0x3C];
const BAR_FALL=[0x7E,0x99,0xBD,0x81,0xBD,0x99,0x7E,0x00]; // ASM FallingBarrelSprite

function mirrorBytes(sp){
    const out=[];
    for(let r=0;r<sp.length;r++){
        let b=0;
        for(let i=0;i<8;i++)b|=((sp[r]>>i)&1)<<(7-i);
        out.push(b);
    }
    return out;
}
const MARIO_S_L=mirrorBytes(MARIO_S);
const MARIO_R1_L=mirrorBytes(MARIO_R1);
const MARIO_R2_L=mirrorBytes(MARIO_R2);
const MARIO_J_L=mirrorBytes(MARIO_J);

// Girlfriend sprite (20 bytes for top-of-level decoration)
const GF=[0x00,0x00,0x00,0x07,0x1F,0x3A,0xBF,0x7E,0x9C,0x38,0x7E,0x18,0x3C,0x7E,0xFF,0x7F,0x7E,0x82,0x43,0x00];

function drawPlats(){
    for(let y in PLAT_DATA){
        const spans=PLAT_DATA[y];
        const yy=parseInt(y);
        for(let sp of spans){
            dR(sp[0],yy,sp[1]-sp[0]+1,1,BR);
        }
    }
}

function drawDK(){
    const DK=[0x38,0x7C,0x55,0x7D,0x45,0x39,0x7F,0xFF,0xFE,0xBC,0xDC,0x5E,0x3E,0x7E,0x7E,0x67,0x67,0xE0,0xE0,0x00];
    // DK sitting on top walkway — bottom of sprite touches platform top
    dS(DK,68,wy(0)-19,O);
}
function drawGF(){
    // Pauline sprite at x=115 (shifted right from DK), on same walkway
    const gx=115,gy=wy(0)-19;
    for(let r=0;r<GF.length;r++){
        const b=GF[r];
        if(b===0)continue;
        // Colors: top skin/neck = yellow, middle dress = blue, bottom hem = yellow
        const clr=(r>=3&&r<=6)||(r>=17)?YL:BL;
        for(let c=0;c<8;c++)if(b&(0x80>>c))dR(gx+c,gy+r,1,1,clr);
    }
}
function drawBarrel(o){
    const col=o.fb?[40,100,255]:O;
    const top=o.y-8;
    if(o.s===2){dS(BAR_FALL,o.x,top,col);return}
    dS(Math.floor(st.fr/3)%2?BAR:BAR2,o.x,top,col);
}

const NFO=[
[0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
[0x7E,0x18,0x18,0x18,0x38,0x18,0x08,0x00],
[0x7E,0x18,0x18,0x7E,0x18,0x18,0x7E,0x00],
[0x7E,0x18,0x18,0x7E,0x18,0x18,0x7E,0x00],
[0x3C,0x24,0x24,0x7E,0x06,0x06,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x18,0x18,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x60,0x60,0x7E,0x00],
[0x7E,0x18,0x30,0x30,0x30,0x30,0x30,0x00],
[0x7E,0x60,0x60,0x7E,0x60,0x60,0x7E,0x00],
[0x7E,0x60,0x60,0x7E,0x18,0x18,0x7E,0x00]];

function drawMario(){
    // Determine sprite based on state
    // Original ASM sprites are LEFT-facing; _L variants are bit-reversed (RIGHT-facing)
    const isLeft=st.jht>0?(st.jht_dir===0xFD):(st.md===0||st.md===-1);
    let sp,topOff;
    if(st.jht>0||st.flg){
        // Jumping: use jump sprite
        sp=isLeft?MARIO_J:MARIO_J_L;
        topOff=16;
    }else if(keys['ArrowLeft']||keys['ArrowRight']){
        // Walking: alternate run frames every 4 frames
        const fr=Math.floor(st.fr/4)%2;
        if(fr){
            sp=isLeft?MARIO_R1:MARIO_R1_L;
            topOff=19;
        }else{
            sp=isLeft?MARIO_R2:MARIO_R2_L;
            topOff=21;
        }
    }else{
        // Stationary
        sp=isLeft?MARIO_S:MARIO_S_L;
        topOff=18;
    }
    const mx=st.md===0?st.mx-1:(st.md===1?st.mx+1:st.mx);
    const my=st.my-topOff;
    dS(sp,mx,my,R);
}


function drawScore(){
    const d=[];let s=st.score;
    for(let i=0;i<6;i++){d[i]=s%10;s=Math.floor(s/10)}
    for(let i=0;i<6;i++){
        const f=NFO[d[5-i]];
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
            if(f[r]&(0x80>>c))dR(260+i*8+c,2+r,1,1,W);
        }
    }
}

function drawBJCount(){
    const d=[];let n=st.bjc;
    for(let i=0;i<3;i++){d[i]=n%10;n=Math.floor(n/10)}
    for(let i=0;i<3;i++){
        const f=NFO[d[2-i]];
        if(!f)continue;
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
            if(f[r]&(0x80>>c))dR(260+i*8+c,12+r,1,1,YL);
        }
    }
}

function drawLives(){
    for(let i=0;i<st.lives;i++){
        for(let r=0;r<8;r++){
            const b=MARIO_S[r];
            if(r===8)continue;
            for(let c=0;c<4;c++)if(b&(0x80>>c))dR(8+i*12+c,230+r,1,1,R);
        }
    }
}

function render(){
    if(compMode&&refImg){
      // Comparison mode: show reference image, then overlay game diff
      // Step 1: draw reference as background
      for(let y=0;y<240;y++)for(let x=0;x<320;x++){
        const i=(y*320+x)*4;
        const rr=refImg[i],rg=refImg[i+1],rb=refImg[i+2],ra=refImg[i+3];
        if(ra<128){cx.fillStyle='#222';cx.fillRect(x,y,1,1);continue}
        cx.fillStyle='rgb('+rr+','+rg+','+rb+')';
        cx.fillRect(x,y,1,1);
      }
      // Step 2: generate expected game pixels from same logic as drawPlats/drawDK/drawGF
      const gpx={};
      function gPx(x,y){gpx[y+':'+x]=true}
      // Platform pixels from reference PLAT_DATA (walkways + sweeps + connectors)
      for(let y in PLAT_DATA){
        const spans=PLAT_DATA[y];const yy=parseInt(y);
        for(let sp of spans)for(let x=sp[0];x<=sp[1];x++)gPx(x,yy);
      }
      // DK sprite pixels (at position 68, wy(0)-19)
      const DKy=wy(0)-19;
      const DK=[0x38,0x7C,0x55,0x7D,0x45,0x39,0x7F,0xFF,0xFE,0xBC,0xDC,0x5E,0x3E,0x7E,0x7E,0x67,0x67,0xE0,0xE0,0x00];
      for(let r=0;r<DK.length;r++){const b=DK[r];if(b===0)continue;for(let c=0;c<8;c++)if(b&(0x80>>c))gPx(68+c,DKy+r)}
      // GF sprite pixels (at position 115, wy(0)-19)
      const GFy=wy(0)-19;
      for(let r=0;r<GF.length;r++){const b=GF[r];if(b===0)continue;for(let c=0;c<8;c++)if(b&(0x80>>c))gPx(115+c,GFy+r)}
      // Step 3: compare game pixels vs reference
      for(let k in gpx){
        const [yy,xx]=k.split(':').map(Number);
        if(xx<0||xx>=320||yy<0||yy>=240)continue;
        const i=(yy*320+xx)*4;
        const rr=refImg[i],rg=refImg[i+1],rb=refImg[i+2],ra=refImg[i+3];
        if(ra<128){cx.fillStyle='rgba(255,0,0,0.5)';cx.fillRect(xx,yy,1,1);continue}
        const th=40; // tolerance
        if(Math.abs(rr-BR[0])<th&&Math.abs(rg-BR[1])<th&&Math.abs(rb-BR[2])<th){
          cx.fillStyle='rgba(0,255,0,0.3)';cx.fillRect(xx,yy,1,1);
        }else{
          cx.fillStyle='rgba(255,0,0,0.5)';cx.fillRect(xx,yy,1,1);
        }
      }
      cx.fillStyle='#0f0';cx.font='10px monospace';
      cx.fillText('C: toggle   Green=pixel match   Red=extra game pixel   Ref bg=no overlay',5,15);
      return;
    }
    if(st.mode===0){drawAttract();return}
    if(st.mode===1){drawGO();return}
    if(st.mode!==128)return;
    cx.fillStyle='rgb('+B[0]+','+B[1]+','+B[2]+')';
    cx.fillRect(0,0,320,240);
    drawPlats();
    drawDK();
    drawGF();
    for(let o of st.obs)drawBarrel(o);
    drawMario();
    drawScore();
    drawBJCount();
    drawLives();
}

function onPlatform(mx,my){
    for(let w=0;w<NW;w++){
        const surf=ZIG[w];
        if(mx>=surf[0]&&mx<=surf[1]&&my>=wy(w)&&my<wy(w)+4)return w;
    }
    return -1;
}

function update(){
    st.fr++;
    if(st.mode===0){if(sp){ia();st.mode=128;st.bt=80;sp=false}return}
    if(st.mode===1){st.got++;if(st.got>120){st.mode=0;st.lives=2;st.score=0;st.bt=80;
        st.w=5;st.mx=160;st.my=228;st.obs=[];st.ot=0}return}
    if(st.mode!==128)return;
    if(st.dcd>0){st.dcd--;return}
    st.bt--;if(st.bt<=0){st.bt=80;sS()}

    // === BARRELS (run at half rate: ASM processes each barrel every 2 frames) ===
    st.brc=1-st.brc;
    if(st.brc){// skip barrel movement on alternating frames (ASM-style half-rate)
                            const RAMP_X=[112,145,173,203,233,263,293];
                            const RAMP_L=[44,77,105,135,165,195,225];
                            const LADDER_X=[[273,308],[123,203,88,308],[223,273,88,308],[123,163,173,183],[253,273],[193]];
                            const BARREL_LB=[92,90,90,90,92,92];
                            const BARREL_RB=[320,310,310,310,310,310];

                            st.brs=Math.min(40,80-Math.floor(st.score/300));
                            for(let i=st.obs.length-1;i>=0;i--){
                                const o=st.obs[i];
                                if(!o.a){st.obs.splice(i,1);continue}
                                const spd=o.fb?2:1;

                                if(o.s===1){
                                    o.x+=o.d*spd;
                                    if(o.w>=0&&o.w<=4){
                                        const rp=o.d>0?RAMP_X:RAMP_L;
                                        for(let ri=0;ri<7;ri++){
                                            const ex=o.d>0?o.x:o.x+1;
                                            if(ex===rp[ri]){o.y+=1;break}
                                        }
                                    }
                                    if(o.w<5){
                                    o.lc=(o.lc||0)+1;
                                    if(o.lc>=12){
                                        o.lc=0;
                                        const lx=LADDER_X[o.w];
                                        if(lx){
                                            for(let li=0;li<lx.length;li++){
                                                if(Math.abs(o.x-lx[li])<4){
                                                    o.ty=o.w+1;
                                                    o.s=2;
                                                    break;
                                                }
                                            }
                                        }
                                    }
                                    }
                                    if(o.w<5&&(o.x>BARREL_RB[o.w]||o.x<BARREL_LB[o.w])){
                                        o.ty=o.w+1;
                                        o.s=2;
                                    }
                                }else if(o.s===2){
                                    o.y+=2;
                                    if(o.y>=wy(o.ty)){
                                        o.y=wy(o.ty);
                                        o.w=o.ty;
                                        o.s=1;
                                        o.d=-o.d;
                                        o.lc=0;
                                    }
                                }
                                if(o.w===5&&o.x<92){o.a=false;st.score+=100;continue}
                            }
                            } // end if(brc)

                st.ot++;
                if(st.ot%st.brs===0){
                            const act=st.obs.filter(o=>o.a);
                            if(act.length<4)st.obs.push({x:92+Math.floor(Math.random()*8),y:wy(0),w:0,d:1,s:1,a:true,lc:0,ty:0,fb:Math.random()<0.1});
                        }

    // === PLAYER STATE MACHINE (only one state per frame) ===
    if(st.flg){
        // FALLING
        st.my+=2;
        const pw=onPlatform(st.mx,st.my);
        if(pw>=0){
            st.w=pw;st.my=wy(pw);st.flg=0;st.jht=0;
        }
        if(st.my>wy(5)+20){
            st.lives--;sD();
            if(st.lives<=0){st.mode=1;st.got=0}
            else{st.dcd=120;st.my=228;st.mx=160;st.w=5;st.md=-1;st.jht=0;st.flg=0}
        }
    }else if(st.jht>0){
        // JUMPING — ASM: JUMP_HANGTIME=$1F (31 frames), instant rise/fall
        st.jht--;
        // ASM-style: move horizontally at 1px/2frames during jump (same as grounded)
        // Use mr counter for horizontal movement
        if(--st.mr<=0){st.mr=2;
            let jdir=st.jht_dir;
            if(jdir===0xFD&&st.mx>ZIG[st.w][0])st.mx-=1;
            if(jdir===0xFE&&st.mx<ZIG[st.w][1])st.mx+=1;
        }
        if(st.jht<=0){
            // ASM: fall back down by JUMPING_HEIGHT ($07)
            st.my=Math.min(st.my+7,255);
            const pw=onPlatform(st.mx,st.my);
            if(pw>=0){st.w=pw;st.my=wy(pw);st.jht=0;st.flg=0;st.md=st.jht_dir===0xFD?0:(st.jht_dir===0xFE?1:-1);}
            else{st.flg=1;}
        }
    }else{
        // GROUNDED
        // ASM MARIO_MOVE_RATE=$02: move 1px every 2 frames
        let dir=0xFF;
        if(--st.mr>0){/*skip movement this frame*/}else{st.mr=2;
            if(keys['ArrowLeft'])dir=0xFD;
            if(keys['ArrowRight'])dir=0xFE;
            const surf=ZIG[st.w];
            const leftB=surf[0],rightB=surf[1];
            if(st.w===5){
                if(dir===0xFD&&st.mx>leftB){st.mx--;st.md=0}
                if(dir===0xFE&&st.mx<rightB){st.mx++;st.md=1}
            }else{
                if(dir===0xFD&&st.mx>0){st.mx--;st.md=0}
                if(dir===0xFE&&st.mx<315){st.mx++;st.md=1}
            }
        }
        if(!st.flg&&st.jht<=0){
            const pw=onPlatform(st.mx,st.my+2);
            if(pw>=0){st.w=pw;st.my=wy(pw);st.flg=0}
            else{st.my+=2;st.flg=1}
        }
        if((st.mx&3)===0&&(dir===0xFD||dir===0xFE))sW();
        if((keys['Space']||keys['KeyZ'])&&st.hmt<=0){
            st.jht=31; // ASM JUMP_HANGTIME=$1F
            st.jht_dir=st.md<0?0xFF:(st.md===0?0xFD:0xFE);
            st.my-=7;st.md=-1;sJ();
        }
    }

    // === COLLISION & JUMP COUNTER (after all movement) ===
    if(!st.dcd&&st.jht<=0&&!st.flg){
        for(let o of st.obs){
            if(!o.a)continue;
            if(Math.abs(st.mx-o.x)<6&&Math.abs(st.my-o.y)<12){
                st.lives--;sD();
                if(st.lives<=0){st.mode=1;st.got=0}
                else{st.dcd=120;st.my=228;st.mx=160;st.w=5;st.md=-1;st.jht=0}
                break;
            }
        }
    }

    // Barrel-jump counter: Mario airborne & passes over a barrel
    if(st.flg||st.jht>0){
        for(let o of st.obs){
            if(!o.a||o.bj)continue;
            if(Math.abs(st.mx-o.x)<6&&st.my<o.y-12){
                o.bj=1;
                st.bjc++;
            }
        }
    }

    if(st.hmt>0)st.hmt--;
}

function drawAttract(){
    const bg=[B,BR,BG,B][Math.floor(st.fr/30)%4];
    cx.fillStyle='rgb('+bg[0]+','+bg[1]+','+bg[2]+')';
    cx.fillRect(0,0,320,240);
    drawPlats();
    drawDK();
    drawGF();
    const marMX=160+Math.floor(Math.sin(st.fr/30)*60);
    const marMY=wy(5)-16;
    dS(MARIO_S,marMX,marMY,R);
    cx.fillStyle='rgb('+R[0]+','+R[1]+','+R[2]+')';
    cx.font='bold 20px monospace';
    cx.textAlign='center';
    cx.fillText('DONKEY KONG',160,25);
    cx.fillStyle='rgb('+YL[0]+','+YL[1]+','+YL[2]+')';
    cx.font='10px monospace';
    if(Math.floor(st.fr/30)%2)cx.fillText('PRESS SPACE TO START',160,45);
    cx.fillStyle='rgb('+TQ[0]+','+TQ[1]+','+TQ[2]+')';
    cx.fillText('ARROWS: MOVE  SPACE: JUMP',160,60);
    cx.textAlign='left';
}

function drawGO(){
    cx.fillStyle='rgb('+B[0]+','+B[1]+','+B[2]+')';
    cx.fillRect(0,0,320,240);
    cx.fillStyle='rgb('+R[0]+','+R[1]+','+R[2]+')';
    cx.font='bold 16px monospace';
    cx.textAlign='center';
    cx.fillText('GAME OVER',160,110);
    cx.fillStyle='rgb('+YL[0]+','+YL[1]+','+YL[2]+')';
    cx.font='10px monospace';
    if(Math.floor(st.fr/30)%2)cx.fillText('PRESS SPACE TO RESTART',160,130);
    cx.textAlign='left';
}

function loop(){
    // PAL 50fps: run game logic at 20ms intervals
    // Use rAF for smooth rendering only
    const now=performance.now();
    if(now-lt>=20){lt=now;if(!paused){update();render()}}
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
