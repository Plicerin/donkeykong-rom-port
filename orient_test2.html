<canvas id="c" width="520" height="500"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const scale = 8;

// ASM DK data (20 rows including leading $00)
const DK_ASM = [0x00,0xE0,0xE0,0x67,0x67,0x7E,0x7E,0x3E,0x5E,0xDC,0xBC,0xFE,0xFF,0x7F,0x39,0x45,0x7D,0x55,0x7C,0x38];

// On the real Atari, the kernel reads DK BACKWARDS:
// lda DonkeyKong-1,x with x=20...1
// So ATARI_ORDER[0] = DK_ASM[19] = $38 (top of screen)
// ATARI_ORDER[18] = DK_ASM[1] = $E0 (bottom of screen)
const ATARI_ORDER = [];
for(let i=19;i>=1;i--) ATARI_ORDER.push(DK_ASM[i]);
// ATARI_ORDER is what the real Atari 2600 draws from top to bottom

function drawSprite(data, x, y, title) {
    ctx.fillStyle='#fff';
    ctx.font='12px monospace';
    ctx.fillText(title, x, y-8);
    ctx.strokeStyle='#444';
    ctx.strokeRect(x-2, y-2, 8*scale+4, data.length*scale+4);
    for(let r=0;r<data.length;r++){
        const b = data[r];
        for(let c=0;c<8;c++){
            if(b&(0x80>>c)) {
                ctx.fillStyle='#8B4513';
                ctx.fillRect(x+c*scale, y+r*scale, scale, scale);
            }
        }
    }
    // Label rows
    ctx.fillStyle='#0f0';
    ctx.font='9px monospace';
    ctx.fillText('row0', x, y+10);
    ctx.fillStyle='#f00';
    ctx.fillText('row'+(data.length-1), x, y+(data.length-1)*scale+10);
    
    // Show hex values
    ctx.fillStyle='#aaa';
    ctx.font='8px monospace';
    ctx.fillText('0x'+data[0].toString(16).padStart(2,'0'), x+8*scale+4, y+8);
    ctx.fillText('0x'+data[data.length-1].toString(16).padStart(2,'0'), x+8*scale+4, y+(data.length-1)*scale+8);
}

// Panel 1: ASM data, drawn as-is (no flip) = our current code
drawSprite(DK_ASM.slice(1), 10, 40, '1: NO FLIP (current)');

// Panel 2: Atari kernel order (flipped) 
drawSprite(ATARI_ORDER, 180, 40, '2: ATARI KERNEL - FLIP');

// Panel 3: ASM data with $00
drawSprite(DK_ASM, 350, 40, '3: ASM raw (w/$00)');

// Explain
ctx.fillStyle='#ff0';
ctx.font='10px monospace';
ctx.fillText('row0 = first byte drawn (top of screen)', 10, 340);
ctx.fillText('red row = last byte drawn (bottom of screen)', 10, 355);
ctx.fillText('Panel 2 = Panel 1 reversed = what real Atari draws top-to-bottom', 10, 375);
ctx.fillText('On real Atari: $38 (centered, hat top) at TOP, $E0 (left 3, feet) at BOTTOM = upright', 10, 395);
ctx.fillText('Our code: $E0 at TOP, $38 at BOTTOM = UPSIDE DOWN!', 10, 415);
ctx.fillText('CONCLUSION: MUST USE FLIP formula for canvas to match Atari', 10, 435);

// Now test with the user's reference image comparison
// Our MARIO sprite
const MARIO = [0x00,0x3f,0x1b,0x1b,0x3f,0x7b,0x75,0x76,0x7b,0x3f,0x1f,0x3e,0x0f,0xdb,0x99,0x66,0x00];
const MARIO_REV = [...MARIO].reverse();
drawSprite(MARIO, 10, 460, 'Mario NO FLIP');
drawSprite(MARIO_REV, 180, 460, 'Mario FLIP');
</script>
